name: Extract project archive

on:
  push:
    paths:
      - "*.zip"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: extract-project-archive
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Validate and extract archive
        id: archive
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          import stat

          archives = sorted(Path(".").glob("*.zip"))
          if len(archives) != 1:
              raise SystemExit(
                  f"Expected exactly one ZIP in the repository root; found "
                  f"{len(archives)}: {[p.name for p in archives]}"
              )

          archive = archives[0]
          root = Path.cwd().resolve()
          seen = set()

          with ZipFile(archive) as z:
              entries = z.infolist()
              if not entries:
                  raise SystemExit("Archive is empty")

              for info in entries:
                  name = info.filename
                  path = PurePosixPath(name)
                  parts = path.parts

                  if (
                      name.startswith("/")
                      or "\\" in name
                      or not parts
                      or any(part in ("", ".", "..") for part in parts)
                      or any(part in (".git", ".github") for part in parts)
                      or name.endswith(".zip")
                      or name in seen
                  ):
                      raise SystemExit(f"Unsafe or duplicate archive entry: {name}")

                  seen.add(name)
                  mode = info.external_attr >> 16
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f"Symlink not allowed: {name}")

                  target = (root / name).resolve()
                  if not target.is_relative_to(root):
                      raise SystemExit(f"Path escapes repository: {name}")

              for info in entries:
                  target = root / info.filename
                  if info.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(z.read(info))

          archive.unlink()
          print(f"Extracted {archive.name}: {len(entries)} entries")
          PY

      - name: Commit extracted files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Extract project archive"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
